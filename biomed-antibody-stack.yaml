AWSTemplateFormatVersion: '2010-09-09'
Description: Biomedical antibody inventory demo - DynamoDB, Lambda, HTTP API, and CloudWatch alarm.
Resources:
  AntibodyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: biomed-cfn-antibody-repository
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: antibodyID
          AttributeType: S
      KeySchema:
        - AttributeName: antibodyID
          KeyType: HASH
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AntibodyTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AntibodyTable.Arn
  AntibodyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: biomed-cfn-antibody-api
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref AntibodyTable
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from decimal import Decimal
          from botocore.exceptions import ClientError

          table = boto3.resource('dynamodb').Table(os.environ['TABLE_NAME'])

          def reply(status, data):
              return {'statusCode': status, 'headers': {'Content-Type': 'application/json'}, 'body': json.dumps(data, default=str)}

          def lambda_handler(event, context):
              method = event.get('requestContext', {}).get('http', {}).get('method') or event.get('httpMethod') or 'GET'
              try:
                  if method == 'GET':
                      items = []
                      response = table.scan()
                      items.extend(response.get('Items', []))
                      while 'LastEvaluatedKey' in response:
                          response = table.scan(ExclusiveStartKey=response['LastEvaluatedKey'])
                          items.extend(response.get('Items', []))
                      return reply(200, items)

                  body = event.get('body', {})
                  if isinstance(body, str):
                      body = json.loads(body)
                  if not isinstance(body, dict):
                      return reply(400, {'error': 'Body must be a JSON object'})

                  if method == 'POST':
                      required = ['antibodyID', 'antibodyName', 'clone', 'fluorophore', 'quantityRemaining']
                      if any(field not in body for field in required):
                          return reply(400, {'error': 'Missing required fields'})
                      try:
                          quantity = Decimal(str(body['quantityRemaining']))
                          if not quantity.is_finite() or quantity < 0:
                              raise ValueError()
                      except (ValueError, TypeError):
                          return reply(400, {'error': 'Invalid quantity'})
                      item = {field: str(body[field]) for field in required if field != 'quantityRemaining'}
                      item['quantityRemaining'] = quantity
                      try:
                          table.put_item(Item=item, ConditionExpression='attribute_not_exists(antibodyID)')
                      except ClientError as error:
                          if error.response['Error']['Code'] == 'ConditionalCheckFailedException':
                              return reply(409, {'error': 'Antibody ID already exists'})
                          raise
                      return reply(201, {'message': 'Antibody added', 'item': item})

                  if method == 'PUT':
                      antibody_id = body.get('antibodyID')
                      if not antibody_id or 'quantityRemaining' not in body:
                          return reply(400, {'error': 'ID and quantity required'})
                      try:
                          quantity = Decimal(str(body['quantityRemaining']))
                          if not quantity.is_finite() or quantity < 0:
                              raise ValueError()
                      except (ValueError, TypeError):
                          return reply(400, {'error': 'Invalid quantity'})
                      try:
                          response = table.update_item(Key={'antibodyID': antibody_id}, UpdateExpression='SET quantityRemaining = :q', ConditionExpression='attribute_exists(antibodyID)', ExpressionAttributeValues={':q': quantity}, ReturnValues='ALL_NEW')
                      except ClientError as error:
                          if error.response['Error']['Code'] == 'ConditionalCheckFailedException':
                              return reply(404, {'error': 'Antibody not found'})
                          raise
                      return reply(200, {'message': 'Quantity updated', 'item': response['Attributes']})
                  return reply(405, {'error': 'Method not allowed'})
              except (ValueError, TypeError, json.JSONDecodeError):
                  return reply(400, {'error': 'Invalid request data'})
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: biomed-cfn-antibody-api
      ProtocolType: HTTP
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AntibodyFunction.Arn
      PayloadFormatVersion: '2.0'
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /antibodies
      Target: !Sub integrations/${ApiIntegration}
  PostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /antibodies
      Target: !Sub integrations/${ApiIntegration}
  PutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /antibodies
      Target: !Sub integrations/${ApiIntegration}
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AntibodyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/antibodies
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alerts when the demo antibody Lambda reports an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AntibodyFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  ApiUrl:
    Description: Demo API endpoint (public; use only fictional sample data)
    Value: !Sub ${HttpApi.ApiEndpoint}/antibodies
  TableName:
    Value: !Ref AntibodyTable
  FunctionName:
    Value: !Ref AntibodyFunction
